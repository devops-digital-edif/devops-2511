name: Self Hosted Runner
on: workflow_dispatch
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Update Package Manger
        run: sudo apt update
      - name: install nginx
        run: sudo apt install nginx -y
      - name: nginx status
        run: sudo systemctl status nginx
      - name: Print ports
        run: ss -ntpl
        
